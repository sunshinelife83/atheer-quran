name = "quran"
main = "src/worker.js"
compatibility_date = "2025-03-01"
workers_dev = true

[vars]
# عنوان workers.dev الفعلي للإنتاج.
SITE_URL = "https://quran.athirquran.workers.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [
  "/",
  "/index.html",
  "/api/*",
  "/robots.txt",
  "/sitemap.xml",
  "/browse",
  "/browse/*",
  "/surah/*",
  "/reciter/*",
  "/radio/*",
]
not_found_handling = "none"
html_handling = "none"

[observability]
enabled = true
