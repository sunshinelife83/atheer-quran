name = "quran"
main = "src/worker.js"
compatibility_date = "2025-03-01"
workers_dev = true

[vars]
# عنوان workers.dev الفعلي للإنتاج.
SITE_URL = "https://quran.athirquran.workers.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/*"]
not_found_handling = "single-page-application"
html_handling = "none"

[observability]
enabled = true
