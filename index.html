<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="أثير القرآن — منصة القرآن الكريم المتكاملة: إذاعات قرآنية مباشرة، مكتبة تلاوات بأكثر من 100 رواية وقارئ، وحفظ للسور للاستماع دون اتصال." />
    <meta name="keywords" content="قرآن كريم، إذاعة قرآنية، تلاوة، تحفيظ، استماع، تنزيل، مكتبة قرآنية" />
    <meta property="og:title" content="أثير القرآن — منصة القرآن الكريم المتكاملة" />
    <meta property="og:description" content="استمع إلى كلام الله في أجمل تلاوة وأصفى بث. إذاعات مباشرة، مكتبة صوتية متكاملة، وتشغيل دون اتصال." />
    <meta property="og:type" content="website" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="أثير القرآن" />
    <title>أثير القرآن — منصة القرآن الكريم المتكاملة</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("atheer_theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          if (t === "light") document.body.classList.add("light");
        } catch (e) {}
      })();
    </script>

    <!-- App header -->
    <nav class="topbar" role="navigation" aria-label="التنقل الرئيسي">
      <div class="shell nav-inner">

        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" aria-label="شعار أثير القرآن" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="5" y="5" width="14" height="14" transform="rotate(0 12 12)" />
              <rect x="5" y="5" width="14" height="14" transform="rotate(15 12 12)" />
              <rect x="5" y="5" width="14" height="14" transform="rotate(30 12 12)" />
              <rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)" />
              <rect x="5" y="5" width="14" height="14" transform="rotate(60 12 12)" />
              <rect x="5" y="5" width="14" height="14" transform="rotate(75 12 12)" />
              <circle cx="12" cy="12" r="4" stroke-width="1" />
              <circle cx="12" cy="12" r="2.5" stroke-width="1" />
            </svg>
          </div>
          <div class="brand-copy">
            <h1>
              <span class="brand-accent">أثير</span> القرآن
            </h1>
            <p>استمع، واحفظ، واستكمل من حيث توقفت</p>
          </div>
        </div>

        <div class="nav-actions">
          <button class="icon-button" id="themeToggle" type="button" title="تبديل المظهر" aria-label="تبديل بين الوضع الليلي والنهاري">
            <span id="themeIcon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
              </svg>
            </span>
          </button>
          <button class="install-button hidden" id="installApp" type="button" aria-label="تثبيت التطبيق">
            تثبيت
          </button>
        </div>

      </div>
    </nav>

    <!-- Listening context and primary navigation -->
    <header class="hero" role="banner">
      <div class="shell hero-content">
        <div class="hero-copy">
          <div class="badge" role="note">
            تجربة استماع هادئة
          </div>
          <h2 class="hero-title">
            استمع إلى ما تحتاجه، ثم أكمل من حيث توقفت.
          </h2>
          <p>
            إذاعات مباشرة، مكتبة تلاوات، وتنزيلات تعمل دون اتصال—بواجهة واحدة واضحة.
          </p>
        </div>
        <nav class="tabs" role="tablist" aria-label="أقسام التطبيق">
          <button class="tab active" type="button" role="tab" aria-selected="true"  data-tab="home"      id="tab-home"      aria-controls="view">الرئيسية</button>
          <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="radios"    id="tab-radios"    aria-controls="view">الراديو والبث</button>
          <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="library"   id="tab-library"   aria-controls="view">مكتبة التلاوات</button>
          <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="downloads" id="tab-downloads" aria-controls="view">تنزيلاتي</button>
          <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="history"   id="tab-history"   aria-controls="view">سجل الاستماع</button>
          <button class="tab"        type="button" role="tab" aria-selected="false" data-tab="settings"  id="tab-settings"  aria-controls="view">الإعدادات</button>
          <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
        </nav>
      </div>
    </header>

    <main class="shell main" id="main-content">
      <section id="view" role="tabpanel" aria-live="polite" aria-atomic="false"></section>
    </main>

    <section class="player player-hidden" id="player" aria-label="مشغل الصوت" role="complementary">
      <div class="player-progress" id="playerProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="تقدم التشغيل"></div>
      <div class="shell player-inner">
        <audio id="audio" aria-label="مشغل الصوت"></audio>

        <div class="track">
          <div class="track-icon" id="trackIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
          <div class="track-copy">
            <h3 id="trackTitle">لا يوجد تشغيل</h3>
            <p id="trackSubtitle"></p>
            <div class="eq hidden" id="eqBars" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>

        <div class="player-controls">
          <div class="control-row">
            <button class="plain-button" id="prevBtn" type="button" title="السورة السابقة" aria-label="السورة السابقة">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="play-main" id="playPauseBtn" type="button" title="تشغيل/إيقاف" aria-label="تشغيل أو إيقاف">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="plain-button" id="nextBtn" type="button" title="السورة التالية" aria-label="السورة التالية">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
            </button>
            <button class="tool-button" id="expandPlayer" type="button" title="توسيع المشغل" aria-label="توسيع المشغل أو تصغيره" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
          </div>

          <div class="seek-row" id="seekRow">
            <span id="currentTime" aria-label="الوقت الحالي">00:00</span>
            <input id="seek" type="range" min="0" max="100" value="0" step="0.5" aria-label="شريط التقدم" />
            <span id="duration" aria-label="المدة الكلية">00:00</span>
          </div>

          <div class="live-row hidden" id="liveRow" aria-live="polite">
            <span>● يبث الآن مباشرة</span>
          </div>
        </div>

        <div class="player-actions" style="display: flex; gap: 4px;">
          <button class="tool-button" id="hidePlayerBtn" type="button" title="تصغير المشغل" aria-label="تصغير المشغل">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 14h6v6" /><path d="M20 10h-6V4" /><path d="M14 10l7-7" /><path d="M3 21l7-7" />
            </svg>
          </button>
          <button class="tool-button danger" id="exitPlayerBtn" type="button" title="إيقاف وإغلاق" aria-label="إيقاف وإغلاق">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="player-tools">
          <div class="player-tools-content">
            <button class="tool-button" id="repeatBtn" type="button" title="تكرار السورة" aria-label="تكرار السورة الحالية">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-inline-end:4px;" aria-hidden="true">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14M7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
              </svg>
              تكرار
            </button>

            <label for="sleepTimer" class="sr-only">مؤقت النوم</label>
            <select id="sleepTimer" title="مؤقت النوم" aria-label="مؤقت النوم">
              <option value="0">مؤقت النوم</option>
              <option value="10">10 دقائق</option>
              <option value="20">20 دقيقة</option>
              <option value="30">30 دقيقة</option>
              <option value="60">60 دقيقة</option>
            </select>

            <label for="speed" class="sr-only">سرعة التشغيل</label>
            <select id="speed" title="سرعة التشغيل" aria-label="سرعة التشغيل">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>

            <label for="volume" class="sr-only">مستوى الصوت</label>
            <input id="volume" type="range" min="0" max="1" value="0.8" step="0.02" title="مستوى الصوت" aria-label="مستوى الصوت" />

            <button class="plain-button danger" id="closePlayer" type="button" title="إغلاق المشغل" aria-label="إغلاق المشغل">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>

      </div>
    </section>

    <button class="fab-unhide fab-hidden" id="unhidePlayerBtn" type="button" title="إظهار المشغل" aria-label="إظهار المشغل">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </button>

    <a href="#main-content" class="skip-link">
      انتقل إلى المحتوى الرئيسي
    </a>

    <script type="module" src="/app.js"></script>
  </body>
</html>
